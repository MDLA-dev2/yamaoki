    ctx.fillRect(494, 0, 18, 512);

    ctx.strokeStyle = 'rgba(165, 122, 54, 0.45)';
    ctx.lineWidth = 1.5;
    for (var hx = 18; hx < 494; hx += 16) {
      ctx.strokeRect(hx + 3, 5, 10, 10);

    }

    var map = new THREE.CanvasTexture(cv);
    var bump = new THREE.CanvasTexture(bCv);
    map.wrapS = map.wrapT = bump.wrapS = bump.wrapT = THREE.RepeatWrapping;
    map.repeat.set(6, 5);

  function createShojiTexture() {
    var cv = document.createElement('canvas');
    cv.width = 512; cv.height = 512;
    var ctx = cv.getContext('2d');
    var g = ctx.createLinearGradient(0, 0, 0, 512);
    g.addColorStop(0, '#1e2836');
    g.addColorStop(0.5, '#2b3644');
    g.addColorStop(1, '#1a1e24');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 512, 512);

    // Силуэты ветвей бамбука за бумажной перегородкой в лунном свете
    ctx.save();
    ctx.strokeStyle = 'rgba(10, 14, 20, 0.42)';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(90, 512); ctx.quadraticCurveTo(130, 260, 195, 20);
    ctx.moveTo(360, 512); ctx.quadraticCurveTo(330, 280, 290, 40);
    ctx.stroke();
    // Листья бамбука
    ctx.fillStyle = 'rgba(10, 14, 20, 0.36)';
    [[140, 220, 0.4], [155, 190, -0.3], [175, 130, 0.5], [335, 260, -0.5], [315, 180, 0.3]].forEach(function (lf) {
      ctx.save();
      ctx.translate(lf[0], lf[1]);
      ctx.rotate(lf[2]);
      ctx.beginPath(); ctx.ellipse(0, 0, 28, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
    ctx.restore();

    // Деревянная решётка кумико
    ctx.fillStyle = '#140c06';
    for (var x = 0; x <= 512; x += 64) ctx.fillRect(x - 3, 0, 6, 512);
    for (var y = 0; y <= 512; y += 42) ctx.fillRect(0, y - 2.5, 512, 5);
    return new THREE.CanvasTexture(cv);
  }

  function createParticleGlowTexture() {

    g.addColorStop(0.28, 'rgba(255, 225, 165, 0.85)');

    g.addColorStop(1, 'rgba(255, 120, 30, 0)');
    ctx.fillStyle = g;

    return new THREE.CanvasTexture(cv);
  }

  function createTsukaWrapTexture() {
    var cv = document.createElement('canvas');
    cv.width = 256; cv.height = 64;
    var ctx = cv.getContext('2d');
    // Белая кожа ската (самэгава) под оплёткой
    ctx.fillStyle = '#d8cdb8';
    ctx.fillRect(0, 0, 256, 64);
    // Тёмно-бордовая шёлковая оплётка цука-ито ромбами
    ctx.fillStyle = '#6e160e';
    ctx.strokeStyle = '#290603';
    ctx.lineWidth = 2;
    for (var x = -16; x < 272; x += 28) {
      ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x + 18, 32); ctx.lineTo(x, 64); ctx.lineTo(x - 10, 64); ctx.lineTo(x + 8, 32); ctx.lineTo(x - 10, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x + 14, 0); ctx.lineTo(x - 4, 32); ctx.lineTo(x + 14, 64); ctx.lineTo(x + 24, 64); ctx.lineTo(x + 6, 32); ctx.lineTo(x + 24, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    var tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  // Создаём живую помятую 3D-геометрию листа бумаги с приподнятыми уголками
  function createCrumpledPaperGeometry(w, h, seed) {
    var geo = new THREE.PlaneGeometry(w, h, 18, 18);
    geo.rotateX(-Math.PI / 2);
    var pos = geo.attributes.position;
    var r = rng(seed * 31 + 11);
    var c1 = (r() - 0.3) * 0.006;
    var c2 = (r() - 0.3) * 0.006;
    for (var i = 0; i < pos.count; i++) {
      var vx = pos.getX(i);
      var vz = pos.getZ(i);
      var nx = vx / (w * 0.5);
      var nz = vz / (h * 0.5);
      // Плавный изгиб середины и приподнятые углы старой бумаги
      var arch = Math.cos(nx * Math.PI * 0.5) * Math.cos(nz * Math.PI * 0.5) * 0.0025;
      var cornerLift = Math.pow(Math.max(0, (Math.abs(nx) + Math.abs(nz)) - 1.15), 2) * (nx > 0 ? c1 : c2);
      var wave = Math.sin(vx * 18 + seed) * Math.cos(vz * 18 - seed) * 0.0012;
      pos.setY(i, arch + cornerLift + wave);
    }
    geo.computeVertexNormals();
    return geo;
  }

    var newCv = renderSheetCanvas(item);
    entry.mesh.material.map.image = newCv;
    entry.mesh.material.map.needsUpdate = true;
  }

  /* ==========================================================================
     12. 3D ШЁЛКОВЫЕ НИТИ ОТ БУЛАВКИ К БУЛАВКЕ (ЛОР СЛЕВА И ПОВЫШЕНИЕ СПРАВА)
     ========================================================================== */
  var threadsGroup = new THREE.Group();
  deskGroup.add(threadsGroup);

  var loreSequence = ['title', 's1', 's2', 's3', 's4', 's5', 's6'];
  var rankSequence = ['rank-cd', 'r1', 'r2', 'r3', 'r4', 'r5', 'r6', 'r7', 'r8', 'r9'];

  var loreThreadMat = new THREE.MeshStandardMaterial({ color: 0x9c281c, roughness: 0.55 });
  var rankThreadMat = new THREE.MeshStandardMaterial({ color: 0xa82418, roughness: 0.5 });
  var activeGoalThreadMat = new THREE.MeshStandardMaterial({
    color: 0xff4824,
    emissive: new THREE.Color(0xb8220c),
    emissiveIntensity: 0.55,
    roughness: 0.35
  });

  function getPinPosition(id) {
    var e = sheetMapById[id];
    if (!e) return null;
    // Локальная координата булавки (0, 0.011, -h * 0.42) с учётом поворота листа
    var localZ = -e.item.h * 0.42;
    var sinR = Math.sin(e.group.rotation.y);
    var cosR = Math.cos(e.group.rotation.y);
    return new THREE.Vector3(
      e.group.position.x + localZ * sinR,
      DESK_Y + 0.013,
      e.group.position.z + localZ * cosR
    );
  }

  function rebuild3DThreads() {
    while (threadsGroup.children.length > 0) {
      var ch = threadsGroup.children[0];
      if (ch.geometry) ch.geometry.dispose();
      threadsGroup.remove(ch);
    }

    // 1) Последовательная нить чтения Лора (от булавки к булавке: Титул -> I -> II -> III -> IV -> V -> VI)
    for (var l = 0; l < loreSequence.length - 1; l++) {
      var la = getPinPosition(loreSequence[l]);
      var lb = getPinPosition(loreSequence[l + 1]);
      if (!la || !lb) continue;
      var lMid = new THREE.Vector3((la.x + lb.x) * 0.5, DESK_Y + 0.0055, (la.z + lb.z) * 0.5 + 0.035);
      var lCurve = new THREE.CatmullRomCurve3([la, lMid, lb]);
      var lGeo = new THREE.TubeGeometry(lCurve, 18, 0.0024, 6, false);
      var lMesh = new THREE.Mesh(lGeo, loreThreadMat);
      lMesh.castShadow = true;
      threadsGroup.add(lMesh);
    }

    // 2) Последовательная нить Системы Повышения (от булавки к булавке)
    var goalIdx = -1;
    if (goalKey) {
      for (var g = 0; g < rankSequence.length; g++) {
        var ge = sheetMapById[rankSequence[g]];
        if (ge && ge.item.num === goalKey) { goalIdx = g; break; }
      }
    }

    for (var i = 0; i < rankSequence.length - 1; i++) {
      var p1 = getPinPosition(rankSequence[i]);
      var p2 = getPinPosition(rankSequence[i + 1]);
      if (!p1 || !p2) continue;
      var mid = new THREE.Vector3((p1.x + p2.x) * 0.5, DESK_Y + 0.0055, (p1.z + p2.z) * 0.5 + 0.035);
      var curve = new THREE.CatmullRomCurve3([p1, mid, p2]);
      var isGoalPath = goalIdx > i;
      var tGeo = new THREE.TubeGeometry(curve, 18, isGoalPath ? 0.0032 : 0.0024, 6, false);
      var tMesh = new THREE.Mesh(tGeo, isGoalPath ? activeGoalThreadMat : rankThreadMat);
      tMesh.castShadow = true;
      threadsGroup.add(tMesh);
    }
  }
  rebuild3DThreads();

  /* ==========================================================================
     13. МЯГКИЕ КРУГЛЫЕ ЧАСТИЦЫ ПЫЛИНОК И ТЁПЛЫХ УГОЛЬКОВ В ВОЗДУХЕ
     ========================================================================== */
  var PARTICLE_COUNT = 95;
  var pGeo = new THREE.BufferGeometry();
  var pPositions = new Float32Array(PARTICLE_COUNT * 3);
  var pVel = [];

  for (var pi = 0; pi < PARTICLE_COUNT; pi++) {
    pPositions[pi * 3] = (Math.random() - 0.5) * 4.4;
    pPositions[pi * 3 + 1] = DESK_Y + Math.random() * 1.65;
    pPositions[pi * 3 + 2] = (Math.random() - 0.5) * 2.6;
    pVel.push({
      vx: (Math.random() - 0.5) * 0.05,
      vy: 0.025 + Math.random() * 0.055,
      vz: (Math.random() - 0.5) * 0.05,
      phase: Math.random() * Math.PI * 2
    });
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));

  var glowTex = createParticleGlowTexture();
  var pMat = new THREE.PointsMaterial({
    map: glowTex,
    color: 0xffc878,
    size: 0.048,
    transparent: true,
    opacity: 0.72,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  var particlesMesh = new THREE.Points(pGeo, pMat);
  scene.add(particlesMesh);

  /* ==========================================================================
     14. КАМЕРА И УПРАВЛЕНИЕ: СРАЗУ ОТ ПЕРВОГО ЛИЦА БЕЗ ЗАСТАВОК + РЕЖИМ КУРСОРА (TAB)
     ========================================================================== */
  var mode = 'fps'; // 'fps' или 'desk'
  var isPointerLocked = false;
  var crosshair = document.getElementById('crosshair');
  var hoverLabel = document.getElementById('hoverLabel');
  var readerEl = document.getElementById('reader');

  // Игрок сразу стоит перед столом и смотрит на разложенные листы
  var fpsPos = new THREE.Vector3(-0.12, 1.54, 1.08);
  var fpsYaw = 0;
  var fpsPitch = -0.58;
  var isCrouching = false;
  var walkBobTimer = 0;
  var lastStepSound = 0;
  var keys = { w: false, a: false, s: false, d: false };

  // Параметры для режима свободного курсора (Tab)
  var orbitTarget = new THREE.Vector3(0.0, DESK_Y, 0.04);
  var orbitSphere = { radius: 2.15, theta: 0.0, phi: 0.55 };

  function syncCameraImmediately() {
    camera.position.copy(fpsPos);
    var euler = new THREE.Euler(fpsPitch, fpsYaw, 0, 'YXZ');
    camera.quaternion.setFromEuler(euler);
  }
  syncCameraImmediately();

  function toggleMode() {
    if (mode === 'fps') {
      mode = 'desk';
      if (document.pointerLockElement) document.exitPointerLock();
      crosshair.classList.add('hidden');
      orbitTarget.set(clamp(fpsPos.x, -1.0, 1.0), DESK_Y, 0.04);
    } else {
      mode = 'fps';
      crosshair.classList.remove('hidden');
      if (!readerEl.classList.contains('open')) {
        try { renderer.domElement.requestPointerLock(); } catch (e) {}
      }
    }
  }

  document.addEventListener('pointerlockchange', function () {
    isPointerLocked = (document.pointerLockElement === renderer.domElement);
    if (isPointerLocked) {
      mode = 'fps';
      crosshair.classList.remove('hidden');
    }
  });

  /* ==========================================================================
     15. RAYCASTER, ОТКРЫТИЕ ЛИСТОВ (ЛКМ) И ПЕРЕТАСКИВАНИЕ ПО СТОЛУ (ПКМ)
     ========================================================================== */
  var raycaster = new THREE.Raycaster();
  var pointerNDC = new THREE.Vector2(0, 0);
  var deskPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -DESK_Y);
  var planeIntersect = new THREE.Vector3();

  var hoveredSheetMesh = null;
  var draggedSheet = null;
  var isOrbitDragging = false;
  var isLookDragging = false;
  var pointerDownPos = { x: 0, y: 0 };

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function updateRaycaster() {
    if (readerEl.classList.contains('open')) return;
    if (mode === 'fps' && isPointerLocked) {
      pointerNDC.set(0, 0);
    }
    raycaster.setFromCamera(pointerNDC, camera);

    // Светильник игрока плавно следует за точкой взгляда на столе
    if (raycaster.ray.intersectPlane(deskPlane, planeIntersect)) {
      var tx = clamp(planeIntersect.x, -DESK_W * 0.52, DESK_W * 0.52);
      var tz = clamp(planeIntersect.z, -DESK_D * 0.52, DESK_D * 0.52);
      handLamp.position.x += (tx - handLamp.position.x) * 0.16;
      handLamp.position.z += (tz + 0.10 - handLamp.position.z) * 0.16;
    }

    if (draggedSheet) {
      if (raycaster.ray.intersectPlane(deskPlane, planeIntersect)) {
        var nx = clamp(planeIntersect.x - draggedSheet.offsetX, -DESK_W * 0.45, DESK_W * 0.45);
        var nz = clamp(planeIntersect.z - draggedSheet.offsetZ, -DESK_D * 0.43, DESK_D * 0.43);
        var dx = nx - draggedSheet.group.position.x;
        var dz = nz - draggedSheet.group.position.z;
        if (Math.hypot(dx, dz) > 0.002) {
          draggedSheet.group.position.x = nx;
          draggedSheet.group.position.z = nz;
          draggedSheet.moved = true;
          Snd.drag(Math.hypot(dx, dz) * 32);
          rebuild3DThreads();
        }
      }
      return;
    }

    var hits = raycaster.intersectObjects(sheetMeshes, false);
    if (hits.length > 0) {
      var hitMesh = hits[0].object;
      if (hoveredSheetMesh !== hitMesh) {
        hoveredSheetMesh = hitMesh;
        Snd.pick();
      }
      var it = hitMesh.userData.item;
      var titleText = it.num ? (it.num + (it.tag ? ' · ' + it.tag : '')) : 'Зарисовка восхождения';
      hoverLabel.textContent = titleText + (it.openable ? ' [ЛКМ — читать · ПКМ — двигать]' : ' [ПКМ — двигать]');
      hoverLabel.classList.add('show');
      crosshair.classList.add('active');
    } else {
      hoveredSheetMesh = null;
      hoverLabel.classList.remove('show');
      crosshair.classList.remove('active');
    }
  }

  renderer.domElement.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  renderer.domElement.addEventListener('pointermove', function (e) {
    if (readerEl.classList.contains('open')) return;

    if (mode === 'fps' && isPointerLocked) {
      fpsYaw -= e.movementX * 0.0021;
      fpsPitch = clamp(fpsPitch - e.movementY * 0.0021, -1.42, 0.85);
      pointerNDC.set(0, 0);
      return;
    }

    pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;

    if (mode === 'fps' && isLookDragging && !draggedSheet) {
      fpsYaw -= e.movementX * 0.003;
      fpsPitch = clamp(fpsPitch - e.movementY * 0.003, -1.42, 0.85);
      return;
    }

    if (mode === 'desk' && isOrbitDragging) {
      if (e.buttons === 2 || e.shiftKey) {
        var panSpeed = 0.0022 * orbitSphere.radius;
        orbitTarget.x = clamp(orbitTarget.x - e.movementX * panSpeed, -1.45, 1.45);
        orbitTarget.z = clamp(orbitTarget.z - e.movementY * panSpeed, -0.65, 0.65);
      } else {
        orbitSphere.theta = clamp(orbitSphere.theta - e.movementX * 0.0045, -1.1, 1.1);
        orbitSphere.phi = clamp(orbitSphere.phi - e.movementY * 0.0045, 0.22, 1.28);
      }
    }
  });

  var topDragOrder = 30;
  renderer.domElement.addEventListener('pointerdown', function (e) {
    if (readerEl.classList.contains('open')) return;
    pointerDownPos.x = e.clientX;
    pointerDownPos.y = e.clientY;

    if (mode === 'fps' && !isPointerLocked) {
      pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
    } else if (mode === 'fps' && isPointerLocked) {
      pointerNDC.set(0, 0);
    }

    raycaster.setFromCamera(pointerNDC, camera);
    var hits = raycaster.intersectObjects(sheetMeshes, false);

    // ПКМ на листе (в любом режиме) или ЛКМ в режиме курсора начинает перетаскивание бумажки
    if (hits.length > 0 && (e.button === 2 || (mode === 'desk' && e.button === 0))) {
      var hitMesh = hits[0].object;
      if (raycaster.ray.intersectPlane(deskPlane, planeIntersect)) {
        var grp = hitMesh.userData.sheetGroup;
        topDragOrder++;
        hitMesh.userData.baseY = DESK_Y + 0.0025 + topDragOrder * 0.0006;
        draggedSheet = {
          mesh: hitMesh,
          group: grp,
          item: hitMesh.userData.item,
          offsetX: planeIntersect.x - grp.position.x,
          offsetZ: planeIntersect.z - grp.position.z,
          moved: false,
          button: e.button
        };
        Snd.pick();
        return;
      }
    }

    if (mode === 'fps') {
      if (!isPointerLocked && e.button === 0) {
        try { renderer.domElement.requestPointerLock(); } catch (err) {}
      }
      if (e.button === 0 && isPointerLocked && hits.length > 0) {
        var itemFps = hits[0].object.userData.item;
        if (itemFps && itemFps.openable) openReaderByItem(itemFps);
      } else {
        isLookDragging = true;
      }
    } else {
      isOrbitDragging = true;
    }
  });

  window.addEventListener('pointerup', function (e) {
    isLookDragging = false;
    if (draggedSheet) {
      var ds = draggedSheet;
      draggedSheet = null;
      Snd.dragEnd();
      if (ds.moved) {
        Snd.drop();
      } else if (ds.button === 0 && ds.item.openable && Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) < 6) {
        openReaderByItem(ds.item);
      }
    }
    isOrbitDragging = false;
  });

  renderer.domElement.addEventListener('wheel', function (e) {
    if (readerEl.classList.contains('open')) return;
    if (mode === 'desk') {
      orbitSphere.radius = clamp(orbitSphere.radius + e.deltaY * 0.0014, 0.72, 3.2);
    } else {
      camera.fov = clamp(camera.fov + e.deltaY * 0.02, 26, 62);
      camera.updateProjectionMatrix();
    }
  }, { passive: true });

  /* ==========================================================================
     16. КЛАВИАТУРА (WASD — ШАГ, SPACE/C — НАКЛОНИТЬСЯ, TAB — РЕЖИМ КУРСОРА)
     ========================================================================== */
  window.addEventListener('keydown', function (e) {
    var code = e.code;
    if (code === 'Tab') {
      e.preventDefault();
      if (!readerEl.classList.contains('open')) toggleMode();
      return;
    }
    if (readerEl.classList.contains('open')) {
      if (code === 'Escape') closeReader();
      else if (code === 'ArrowLeft') openAt(curReaderIdx - 1);
      else if (code === 'ArrowRight') openAt(curReaderIdx + 1);
      return;
    }

    if (code === 'KeyW' || code === 'ArrowUp') keys.w = true;
    if (code === 'KeyS' || code === 'ArrowDown') keys.s = true;
    if (code === 'KeyA' || code === 'ArrowLeft') keys.a = true;
    if (code === 'KeyD' || code === 'ArrowRight') keys.d = true;
    if (code === 'Space' || code === 'KeyC') {
      e.preventDefault();
      isCrouching = !isCrouching;
      Snd.pick();
    }
    if (code === 'KeyE' && hoveredSheetMesh && hoveredSheetMesh.userData.item.openable) {
      openReaderByItem(hoveredSheetMesh.userData.item);
    }
  });

  window.addEventListener('keyup', function (e) {
    var code = e.code;
    if (code === 'KeyW' || code === 'ArrowUp') keys.w = false;
    if (code === 'KeyS' || code === 'ArrowDown') keys.s = false;
    if (code === 'KeyA' || code === 'ArrowLeft') keys.a = false;
    if (code === 'KeyD' || code === 'ArrowRight') keys.d = false;
  });

  /* ==========================================================================
     17. МОДАЛЬНОЕ ОКНО ЧТЕНИЯ ЛИСТА И ОТМЕТКИ ЗАДАНИЙ / ПЕЧАТИ «ЦЕЛЬ»
     ========================================================================== */
  var openableItems = SHEETS_DATA.filter(function (it) { return it.openable; }).sort(function (a, b) { return a.order - b.order; });
  var rpaper = document.getElementById('rpaper');
  var rscroll = document.getElementById('rscroll');
  var rnum = document.getElementById('rnum');
  var rtag = document.getElementById('rtag');
  var rbody = document.getElementById('rbody');
  var rprev = document.getElementById('rprev');
  var rnext = document.getElementById('rnext');
  var rclose = document.getElementById('rclose');
  var rmark = document.getElementById('rmark');
  var curReaderIdx = -1;
  var wasPointerLockedBeforeRead = false;

  function renderReaderDOM(item, idx) {
    curReaderIdx = idx;
    rnum.textContent = item.num;
    rtag.textContent = item.tag || '';

    var html = '';
    if (item.paragraphs) {
      item.paragraphs.forEach(function (p) { html += '<p>' + p + '</p>'; });
    } else if (item.cdList) {
      html += '<ul class="cd-list">';
      item.cdList.forEach(function (row) {
        var curCls = goalKey === row[0] ? ' class="cur"' : '';
        html += '<li' + curCls + '><span>' + row[0] + '</span><span>' + row[1] + '</span></li>';
      });
      html += '</ul>';
    } else if (item.tasks) {
      html += '<ul class="rank-list">';
      item.tasks.forEach(function (t, tIdx) {
        var tKey = item.num + '::' + tIdx;
        var dCls = doneTasks[tKey] ? ' class="done"' : '';
        html += '<li' + dCls + ' data-task-key="' + tKey + '">' + t + '</li>';
      });
      html += '</ul>';
    }
    rbody.innerHTML = html;

    var oldStamp = rpaper.querySelector('.rank-stamp-dom');
    if (oldStamp) oldStamp.remove();
    if (item.type === 'rank' && goalKey === item.num) {
      var st = document.createElement('i');
      st.className = 'rank-stamp-dom';
      st.textContent = 'цель';
      rpaper.appendChild(st);
    }

    rpaper.className = 'rpaper ' + item.pal + ' ' + item.hand + (item.fold ? ' fold' : '');
    rpaper.style.setProperty('--clip', roughClipCSS(item.seed, 0.7, item.corner));
    rscroll.scrollTop = 0;

    rprev.hidden = (idx === 0);
    rnext.hidden = (idx === openableItems.length - 1);

    if (item.type === 'rank') {
      rmark.hidden = false;
      rmark.textContent = (goalKey === item.num) ? 'снять печать «цель»' : 'поставить печать «цель»';
    } else {
      rmark.hidden = true;
    }
  }

  rbody.addEventListener('click', function (e) {
    var li = e.target.closest('.rank-list li');
    if (!li || !li.dataset.taskKey) return;
    var key = li.dataset.taskKey;
    if (doneTasks[key]) delete doneTasks[key];
    else doneTasks[key] = true;
    saveTasks();
    li.classList.toggle('done', !!doneTasks[key]);
    Snd.pick();
    var curItem = openableItems[curReaderIdx];
    if (curItem) refreshSheetTexture(curItem);
  });

  rmark.addEventListener('click', function () {
    var item = openableItems[curReaderIdx];
    if (!item || item.type !== 'rank') return;
    var prevGoal = goalKey;
    goalKey = (goalKey === item.num) ? null : item.num;
    try {
      if (goalKey) localStorage.setItem(GKEY, goalKey);
      else localStorage.removeItem(GKEY);
    } catch (e) {}

    if (goalKey) Snd.stamp(); else Snd.drop();

    renderReaderDOM(item, curReaderIdx);
    refreshSheetTexture(item);
    if (prevGoal) {
      var prevIt = SHEETS_DATA.find(function (s) { return s.num === prevGoal; });
      if (prevIt) refreshSheetTexture(prevIt);
    }
    refreshSheetTexture(SHEETS_DATA[9]);
    rebuild3DThreads();
  });

  function openAt(idx) {
    if (idx < 0 || idx >= openableItems.length) return;
    var wasOpen = readerEl.classList.contains('open');
    if (!wasOpen) {
      wasPointerLockedBeforeRead = isPointerLocked;
      if (document.pointerLockElement) document.exitPointerLock();
      Snd.open();
    } else {
      Snd.turn();
    }
    renderReaderDOM(openableItems[idx], idx);
    readerEl.classList.add('open');
    readerEl.setAttribute('aria-hidden', 'false');
  }

  function openReaderByItem(item) {
    var idx = openableItems.indexOf(item);
    if (idx !== -1) openAt(idx);
  }

  function closeReader() {
    Snd.close();
    readerEl.classList.remove('open');
    readerEl.setAttribute('aria-hidden', 'true');
    if (wasPointerLockedBeforeRead && mode === 'fps') {
      try { renderer.domElement.requestPointerLock(); } catch (e) {}
    }
  }

  rclose.addEventListener('click', closeReader);
  rprev.addEventListener('click', function () { openAt(curReaderIdx - 1); });
  rnext.addEventListener('click', function () { openAt(curReaderIdx + 1); });
  readerEl.addEventListener('pointerdown', function (e) { if (e.target === readerEl) closeReader(); });

  /* ==========================================================================
     18. ГЛАВНЫЙ ЦИКЛ 3D-РЕНДЕРА И ФИЗИКИ ПЕРЕМЕЩЕНИЯ
     ========================================================================== */
  var clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(0.05, clock.getDelta());
    var elapsed = clock.getElapsedTime();

    // Мерцание огня в настольном фонаре Андон и жаровне Хибати
    var flicker = Math.sin(elapsed * 8.2) * 0.08 + Math.sin(elapsed * 15.1 + 1.4) * 0.05 + Math.cos(elapsed * 23.7) * 0.03;
    deskLanternLight.intensity = 1.52 + flicker;
    hibachiLight.intensity = 0.85 + flicker * 0.8;
    handLamp.intensity = 1.32 + flicker * 0.45;
    flameMesh.scale.set(1 + flicker * 0.4, 1 + flicker * 0.9, 1 + flicker * 0.4);
    flameHalo.scale.set(1 + flicker * 0.6, 1 + flicker * 1.1, 1 + flicker * 0.6);

    // Плавное парение пылинок и тёплых угольков в воздухе
    var posAttr = pGeo.attributes.position;
    for (var i = 0; i < PARTICLE_COUNT; i++) {
      var v = pVel[i];
      var px = posAttr.getX(i) + (v.vx + Math.sin(elapsed * 1.4 + v.phase) * 0.018) * dt;
      var py = posAttr.getY(i) + v.vy * dt;
      var pz = posAttr.getZ(i) + (v.vz + Math.cos(elapsed * 1.2 + v.phase) * 0.018) * dt;
      if (py > DESK_Y + 1.8) {
        py = DESK_Y + 0.04;
        px = (Math.random() - 0.5) * 3.8;
        pz = (Math.random() - 0.5) * 2.0;
      }
      posAttr.setXYZ(i, px, py, pz);
    }
    posAttr.needsUpdate = true;

    // Движение камеры в режиме от первого лица или свободного курсора
    if (mode === 'fps') {
      var forward = new THREE.Vector3(-Math.sin(fpsYaw), 0, -Math.cos(fpsYaw)).normalize();
      var right = new THREE.Vector3(Math.cos(fpsYaw), 0, -Math.sin(fpsYaw)).normalize();
      var moveVec = new THREE.Vector3();

      if (keys.w) moveVec.add(forward);
      if (keys.s) moveVec.sub(forward);
      if (keys.d) moveVec.add(right);
      if (keys.a) moveVec.sub(right);

      if (moveVec.lengthSq() > 0.001) {
        moveVec.normalize().multiplyScalar((isCrouching ? 1.35 : 2.15) * dt);
        var nextX = clamp(fpsPos.x + moveVec.x, -4.1, 4.1);
        var nextZ = clamp(fpsPos.z + moveVec.z, -2.75, 2.95);

        // Коллизия со столом в центре комнаты
        var halfW = DESK_W * 0.5 + 0.24;
        var halfD = DESK_D * 0.5 + 0.24;
        if (Math.abs(nextX) < halfW && Math.abs(nextZ) < halfD) {
          if (Math.abs(fpsPos.x) >= halfW) nextX = fpsPos.x;
          if (Math.abs(fpsPos.z) >= halfD) nextZ = fpsPos.z;
        }
        fpsPos.x = nextX;
        fpsPos.z = nextZ;

        walkBobTimer += dt * 9.5;
        if (elapsed - lastStepSound > 0.44) {
          lastStepSound = elapsed;
          Snd.step();
        }
      }

      var targetEyeY = (isCrouching ? 1.18 : 1.56) + Math.sin(walkBobTimer) * 0.015;
      fpsPos.y += (targetEyeY - fpsPos.y) * Math.min(1, dt * 10);

      camera.position.copy(fpsPos);
      var euler = new THREE.Euler(fpsPitch, fpsYaw, 0, 'YXZ');
      camera.quaternion.setFromEuler(euler);
    } else {
      var targetCamPos = new THREE.Vector3(
        orbitTarget.x + orbitSphere.radius * Math.sin(orbitSphere.phi) * Math.sin(orbitSphere.theta),
        orbitTarget.y + orbitSphere.radius * Math.cos(orbitSphere.phi),
        orbitTarget.z + orbitSphere.radius * Math.sin(orbitSphere.phi) * Math.cos(orbitSphere.theta)
      );
      camera.position.lerp(targetCamPos, Math.min(1, dt * 8));
      camera.lookAt(orbitTarget);
    }

    updateRaycaster();

    // Плавный подъём бумажки над столом при наведении или перетаскивании
    for (var s = 0; s < sheetMeshes.length; s++) {
      var sm = sheetMeshes[s];
      var grp = sm.userData.sheetGroup;
      var isHover = (hoveredSheetMesh === sm);
      var isDrag = (draggedSheet && draggedSheet.mesh === sm);
      var targetY = sm.userData.baseY + (isDrag ? 0.028 : (isHover ? 0.011 : 0));
      grp.position.y += (targetY - grp.position.y) * Math.min(1, dt * 14);
    }

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      SHEETS_DATA.forEach(function (it) { refreshSheetTexture(it); });
    });
  }

  window.onload = function () {
    animate();
  };
})();
</script>
</body>
